global:
  security:
    allowInsecureImages: true
  imagePullSecrets:
    - name: ghcr-pull

api:
  image:
    repository: ghcr.io/your-org/directport-api
    pullPolicy: Always
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  env:
    CORS_ORIGIN: 'https://admin-stage.directport.ru'

adminWeb:
  image:
    repository: ghcr.io/your-org/directport-admin-web
    pullPolicy: Always

landing:
  image:
    repository: ghcr.io/your-org/directport-landing
    pullPolicy: Always

clientBot:
  image:
    repository: ghcr.io/your-org/directport-client-bot
    pullPolicy: Always

managerBot:
  image:
    repository: ghcr.io/your-org/directport-manager-bot
    pullPolicy: Always
  # Дефолт чарта = прод-домен (admin-access.directport.ru); на stage deep-link ведут на свой публичный хост.
  adminWebBaseUrl: 'https://coreimport-admin.lab42-stg.work'

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: '40m'
  hosts:
    admin:
      host: coreimport-admin.lab42-stg.work
      paths:
        - path: /
          pathType: Prefix
    api:
      host: api-stage.directport.ru
      paths:
        - path: /
          pathType: Prefix
    landing:
      host: coreimport-landing.lab42-stg.work
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: directport-stage-tls
      hosts:
        - coreimport-admin.lab42-stg.work
        - api-stage.directport.ru
        - coreimport-landing.lab42-stg.work

postgresql:
  enabled: true
  host: ''
  auth:
    username: directport
    password: ''
    database: directport

redis:
  enabled: true
  architecture: standalone
  host: ''
  port: 6379
  auth:
    enabled: false
