global:
  imageRegistry: ''
  imagePullSecrets: []

api:
  replicaCount: 1
  image:
    repository: directport/api
    tag: latest
    pullPolicy: IfNotPresent
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    CORS_ORIGIN: '*'
    JWT_ACCESS_EXPIRATION: '30m'
    # Максимальное число товарных позиций (строк таблицы) в загружаемом файле.
    # Переопределяется через GitHub Environment variable MAX_PRODUCT_ROWS_PER_FILE в deploy-workflow.
    MAX_PRODUCT_ROWS_PER_FILE: '700'
    # Макс. возраст auth_date Telegram Login Widget (сек, анти-replay). Читает api при
    # верификации входа в кабинет (TelegramVerifyService). В коде есть дефолт 86400.
    TELEGRAM_AUTH_MAX_AGE_SECONDS: '86400'

adminWeb:
  replicaCount: 1
  image:
    repository: directport/admin-web
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

landing:
  replicaCount: 1
  image:
    repository: directport/landing
    tag: latest
    pullPolicy: IfNotPresent
  port: 3003
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Клиентский бот: приём файлов от клиентов + чат с менеджером.
clientBot:
  replicaCount: 1
  image:
    repository: directport/client-bot
    tag: latest
    pullPolicy: IfNotPresent
  port: 3003
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Менеджерский бот: уведомления, чат с клиентом, запуск расчёта.
managerBot:
  replicaCount: 1
  image:
    repository: directport/manager-bot
    tag: latest
    pullPolicy: IfNotPresent
  port: 3004
  # Публичный URL админки для deep-link кнопок «Открыть в админке» (по ним кликают
  # менеджеры в Telegram). Должен быть ВНЕШНЕ резолвимым доменом.
  # Дефолт = прод-публичный домен админки (admin-access.directport.ru); прод-оверрайды
  # в GitOps (values/directport-prod.yaml) его НЕ переопределяют, так что прод берёт это
  # значение из чарта. ВАЖНО: это НЕ ingress.hosts.admin.host (= admin.directport.ru —
  # внутренний Traefik-Host, на который внешний Caddy переписывает заголовок и который
  # снаружи не резолвится). Stage переопределяет значение под свой публичный хост.
  adminWebBaseUrl: 'https://admin-access.directport.ru'
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '40m'
  hosts:
    admin:
      host: admin.directport.local
      paths:
        - path: /
          pathType: Prefix
    api:
      host: api.directport.local
      paths:
        - path: /
          pathType: Prefix
    landing:
      host: directport.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

postgresql:
  enabled: true
  host: ''
  auth:
    username: directport
    password: ''
    database: directport
  primary:
    # Bitnami chart по дефолту ставит resourcesPreset=nano (192Mi limit), чего не хватает на INSERT
    # 40МБ файла в documents.file_buffer (BYTEA) — postmaster держит несколько копий + WAL buffer и
    # ловит cgroup OOM. См. инцидент 2026-04-26 (postgres OOMKill при загрузке 24МБ).
    resourcesPreset: none
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

redis:
  enabled: true
  host: ''
  port: 6379
  auth:
    enabled: false

secrets:
  # create=true — чарт сам рендерит k8s Secret с переменными окружения из значений ниже
  # (так работает stage и локальный запуск). На GitOps-проде ставим create=false:
  # секрет создаёт External Secrets Operator из Vault, а его имя передаём через existingSecret.
  # Значения ниже (databaseUrl, jwtSecret, tks*, токены ботов и т.д.) применяются ТОЛЬКО при
  # create=true; при create=false они игнорируются — всё приходит из existingSecret (ESO/Vault).
  create: true
  existingSecret: ''
  databaseUrl: ''
  redisUrl: ''
  jwtSecret: ''
  apiInternalKey: ''
  tksApiBaseUrl: 'https://api1.tks.ru'
  tksTnvedApiKey: ''
  tksGoodsApiKey: ''
  anthropicApiKey: ''
  # Токены ботов (отдельные боты в @BotFather)
  clientBotTelegramToken: ''
  managerBotTelegramToken: ''
  # Username менеджерского бота без @ (для deep-link привязки в админке, читает API)
  managerBotUsername: ''
  # Ключ шифрования токенов Telegram-ботов компаний (AES-256-GCM, см. docs/COMPANY_BOTS.md).
  # Произвольная строка → SHA-256 → 32 байта. Без него заведение ботов компаний в админке → 400.
  # На проде (create=false) приходит из Vault/ESO; это значение — только для stage/local (create=true).
  botTokenEncKey: ''

migration:
  enabled: true
