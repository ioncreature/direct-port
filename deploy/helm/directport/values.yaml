global:
  imageRegistry: ''
  imagePullSecrets: []

api:
  replicaCount: 1
  image:
    repository: directport/api
    tag: latest
    pullPolicy: IfNotPresent
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    CORS_ORIGIN: '*'
    JWT_ACCESS_EXPIRATION: '30m'
    # Максимальное число товарных позиций (строк таблицы) в загружаемом файле.
    # Переопределяется через GitHub Environment variable MAX_PRODUCT_ROWS_PER_FILE в deploy-workflow.
    MAX_PRODUCT_ROWS_PER_FILE: '700'

adminWeb:
  replicaCount: 1
  image:
    repository: directport/admin-web
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

landing:
  replicaCount: 1
  image:
    repository: directport/landing
    tag: latest
    pullPolicy: IfNotPresent
  port: 3003
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# tg-bot (self-service) — DEPRECATED, заменён на clientBot + managerBot.
# Шаблоны сохранены; чтобы отключить выкатку, поставьте replicaCount: 0.
tgBot:
  replicaCount: 1
  image:
    repository: directport/tg-bot
    tag: latest
    pullPolicy: IfNotPresent
  port: 3002
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Клиентский бот: приём файлов от клиентов + чат с менеджером.
clientBot:
  replicaCount: 1
  image:
    repository: directport/client-bot
    tag: latest
    pullPolicy: IfNotPresent
  port: 3003
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Менеджерский бот: уведомления, чат с клиентом, запуск расчёта.
managerBot:
  replicaCount: 1
  image:
    repository: directport/manager-bot
    tag: latest
    pullPolicy: IfNotPresent
  port: 3004
  # Публичный URL админки для deep-link кнопок «Открыть в админке».
  # Если пусто — выводится из ingress.hosts.admin.host (https).
  adminWebBaseUrl: ''
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '40m'
  hosts:
    admin:
      host: admin.directport.local
      paths:
        - path: /
          pathType: Prefix
    api:
      host: api.directport.local
      paths:
        - path: /
          pathType: Prefix
    landing:
      host: directport.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

postgresql:
  enabled: true
  host: ''
  auth:
    username: directport
    password: ''
    database: directport
  primary:
    # Bitnami chart по дефолту ставит resourcesPreset=nano (192Mi limit), чего не хватает на INSERT
    # 40МБ файла в documents.file_buffer (BYTEA) — postmaster держит несколько копий + WAL buffer и
    # ловит cgroup OOM. См. инцидент 2026-04-26 (postgres OOMKill при загрузке 24МБ).
    resourcesPreset: none
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

redis:
  enabled: true
  host: ''
  port: 6379
  auth:
    enabled: false

secrets:
  databaseUrl: ''
  redisUrl: ''
  jwtSecret: ''
  apiInternalKey: ''
  tksApiBaseUrl: 'https://api1.tks.ru'
  tksTnvedApiKey: ''
  tksGoodsApiKey: ''
  anthropicApiKey: ''
  # tg-bot (self-service, deprecated)
  telegramBotToken: ''
  # Токены новых ботов (отдельные боты в @BotFather)
  clientBotTelegramToken: ''
  managerBotTelegramToken: ''
  # Username менеджерского бота без @ (для deep-link привязки в админке, читает API)
  managerBotUsername: ''

migration:
  enabled: true
