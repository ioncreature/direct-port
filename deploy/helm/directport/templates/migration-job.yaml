{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "directport.fullname" . }}-migration
  labels:
    {{- include "directport.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "directport.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      {{- $pgHost := ternary (printf "%s-postgresql" .Release.Name) .Values.postgresql.host .Values.postgresql.enabled }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        # Под ArgoCD это PostSync-хук: дожидаемся готовности БД к коннектам,
        # чтобы migration:run не упал, если StatefulSet поднялся, но Postgres ещё не принимает соединения.
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ $pgHost }} 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migration
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          command: ["node", "apps/api/node_modules/typeorm/cli.js", "migration:run", "-d", "apps/api/dist/src/database/data-source.js"]
          envFrom:
            - secretRef:
                name: {{ include "directport.secretName" . }}
{{- end }}
