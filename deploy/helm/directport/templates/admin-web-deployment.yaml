apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "directport.fullname" . }}-admin-web
  labels:
    {{- include "directport.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-web
spec:
  replicas: {{ .Values.adminWeb.replicaCount }}
  selector:
    matchLabels:
      {{- include "directport.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin-web
  template:
    metadata:
      labels:
        {{- include "directport.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin-web
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin-web
          image: "{{ .Values.adminWeb.image.repository }}:{{ .Values.adminWeb.image.tag }}"
          imagePullPolicy: {{ .Values.adminWeb.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.adminWeb.port }}
              protocol: TCP
          env:
            - name: API_URL
              value: {{ include "directport.apiUrl" . | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.adminWeb.port | quote }}
            {{- if .Values.adminWeb.unknownTenantBehavior }}
            # Строгий режим тенанта: домен, не привязанный к компании → 404 (см. lib/tenant.ts).
            # Пусто/не задано — админка работает как раньше (неизвестный домен = дефолтная компания).
            - name: UNKNOWN_TENANT_BEHAVIOR
              value: {{ .Values.adminWeb.unknownTenantBehavior | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              # В строгом режиме тенанта корень 404-ит неизвестные домены (в т.ч. проба по pod IP),
              # поэтому пробы уходят на /healthz (вне tenant-гейта). Без строгого режима — как раньше, /.
              path: {{ if .Values.adminWeb.unknownTenantBehavior }}/healthz{{ else }}/{{ end }}
              port: {{ .Values.adminWeb.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              # В строгом режиме тенанта корень 404-ит неизвестные домены (в т.ч. проба по pod IP),
              # поэтому пробы уходят на /healthz (вне tenant-гейта). Без строгого режима — как раньше, /.
              path: {{ if .Values.adminWeb.unknownTenantBehavior }}/healthz{{ else }}/{{ end }}
              port: {{ .Values.adminWeb.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.adminWeb.resources | nindent 12 }}
