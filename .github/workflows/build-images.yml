name: Build & Push Images

# CI для прод-деплоя через ArgoCD (psy-health/platform-gitops).
# Этот workflow ТОЛЬКО собирает и публикует образы в GHCR — деплой делает ArgoCD,
# который синкает Helm-чарт deploy/helm/directport с values из platform-gitops.
# Образы тегируются:
#   - <long git sha>  — для точного пиннинга версии (image.tag в values/directport-prod.yaml)
#   - prod            — плавающий тег (только с дефолтной ветки); ArgoCD на pullPolicy: Always подхватит
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: admin-web
            dockerfile: apps/admin-web/Dockerfile
          - name: client-bot
            dockerfile: apps/client-bot/Dockerfile
          - name: manager-bot
            dockerfile: apps/manager-bot/Dockerfile
          - name: landing
            dockerfile: apps/landing/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=prod,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}
