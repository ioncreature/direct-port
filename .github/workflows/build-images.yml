name: Build & Push Images

# CI для прод-деплоя через ArgoCD (psy-health/platform-gitops).
# Этот workflow собирает и публикует образы в GHCR, затем открывает авто-PR в platform-gitops,
# бампающий image.tag (→ git sha) в values/directport-prod.yaml. Merge PR = деплой = approval-gate
# (Argo синкает Helm-чарт deploy/helm/directport с values из platform-gitops).
# Образы тегируются:
#   - <long git sha>  — для точного пиннинга версии (этим тегом bump-gitops правит values/directport-prod.yaml)
#   - prod            — плавающий тег (только с дефолтной ветки); pullPolicy: Always оставлен как страховка
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: admin-web
            dockerfile: apps/admin-web/Dockerfile
          - name: client-bot
            dockerfile: apps/client-bot/Dockerfile
          - name: manager-bot
            dockerfile: apps/manager-bot/Dockerfile
          - name: landing
            dockerfile: apps/landing/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=prod,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  # Метаданные триггернувшего коммита для информативного deploy-PR. Отдельная job, т.к. build-and-push —
  # matrix, и его job-outputs из разных шардов перетирают друг друга (надёжного значения не получить).
  commit-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      subject: ${{ steps.meta.outputs.subject }}
      message: ${{ steps.meta.outputs.message }}
    steps:
      - uses: actions/checkout@v6
      - id: meta
        run: |
          {
            echo 'subject<<COMMIT_META_EOF'
            git log -1 --pretty=%s
            echo COMMIT_META_EOF
            echo 'message<<COMMIT_META_EOF'
            git log -1 --pretty=%B
            echo COMMIT_META_EOF
          } >> "$GITHUB_OUTPUT"

  # Открывает PR в GitOps-репо с бампом image.tag всех 5 образов directport. Отдельная job: образы
  # должны быть запушены раньше, чем Argo попытается их подтянуть. Merge PR = деплой = approval-gate
  # (Argo синкает values/directport-prod.yaml). Cross-repo доступ — через GITOPS_PAT (fine-grained PAT
  # к psy-health/platform-gitops: contents + pull-requests:write; заводит 👤 в secrets репо).
  bump-gitops:
    needs: [build-and-push, commit-meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout platform-gitops
        uses: actions/checkout@v6
        with:
          repository: psy-health/platform-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops
          # checkout@v6 хранит persisted git-креды в формате, который
          # peter-evans/create-pull-request не вычищает перед своим push →
          # второй заголовок Authorization и HTTP 400 «Duplicate header».
          # PR-экшен авторизуется через GITOPS_PAT сам, persisted креды тут не нужны.
          persist-credentials: false
      - name: Bump image tags in values/directport-prod.yaml
        run: |
          for svc in api adminWeb landing clientBot managerBot; do
            yq -i ".${svc}.image.tag = \"${{ github.sha }}\"" gitops/values/directport-prod.yaml
          done
      - name: Create deploy PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops
          branch: deploy/directport-${{ github.sha }}
          base: main
          commit-message: 'chore(directport): deploy ${{ github.sha }}'
          title: '[directport] ${{ needs.commit-meta.outputs.subject }}'
          body: |
            **Проект:** DirectPort — `ioncreature/direct-port`
            **Values:** `values/directport-prod.yaml`

            Авто-PR из CI directport (`build-images`). **Merge = деплой** — Argo синкнет `values/directport-prod.yaml`.

            Образы (`${{ github.sha }}`):
            - `ghcr.io/ioncreature/direct-port-api`
            - `ghcr.io/ioncreature/direct-port-admin-web`
            - `ghcr.io/ioncreature/direct-port-landing`
            - `ghcr.io/ioncreature/direct-port-client-bot`
            - `ghcr.io/ioncreature/direct-port-manager-bot`

            Source: [`ioncreature/direct-port@${{ github.sha }}`](https://github.com/ioncreature/direct-port/commit/${{ github.sha }})

            ### Текст коммита

            ```
            ${{ needs.commit-meta.outputs.message }}
            ```
          delete-branch: true
